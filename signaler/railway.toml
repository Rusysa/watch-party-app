# railway.toml — configuración declarativa del deploy en Railway
# Referencia: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Weron no expone un healthcheck HTTP 200 sin habilitar la API de gestión.
# GET / devuelve 501 por defecto; no usarlo como healthcheck de Railway.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
