name: Fedora RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: fedora-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 40
    steps:
      - name: Dependencies
        run: dnf -y install golang nodejs24 nodejs24-bin nodejs24-npm nodejs24-npm-bin python3 gcc gcc-c++ pkgconf-pkg-config gtk3-devel webkit2gtk4.1-devel rpm-build git tar gzip
      - uses: actions/checkout@v4
      - name: Go tests
        working-directory: watchparty
        run: go test -race ./...
      - name: Build Wails app
        working-directory: watchparty
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -clean -tags webkit2_41
      - name: Include Go module notices
        working-directory: watchparty
        run: go list -deps -json . | python3 ../scripts/collect-licenses.py
      - name: Build and inspect RPM
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=0.0.0; fi
          bash scripts/build-rpm.sh "$version"
          rpm -qpl watchparty/build/bin/*.rpm
          rpm -qp --requires watchparty/build/bin/*.rpm
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test -s LICENSE
            test -s packaging/rpm/license.spdx
            test -s packaging/rpm/rpm-license.spdx
            test "$(rpm -qp --queryformat '%{LICENSE}' watchparty/build/bin/*.rpm)" = "$(cat packaging/rpm/rpm-license.spdx)"
          fi
      - name: Package checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp docs/credits.md watchparty/build/bin/CREDITS.md
          cd watchparty/build/bin
          sha256sum ./*.rpm > SHA256SUMS
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: |
            watchparty/build/bin/*.rpm
            watchparty/build/bin/SHA256SUMS
            watchparty/build/bin/CREDITS.md
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require a project license before publishing
        run: |
          test -s LICENSE
          test -s packaging/rpm/license.spdx
          test -s packaging/rpm/rpm-license.spdx
      - uses: actions/download-artifact@v4
        with:
          name: fedora-rpm
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
